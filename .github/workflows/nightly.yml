name: nightly-package

# 两种方式触发：
# 1. 手动触发：拉取私有仓库 kisaragychihaya/llm-chat 指定 ref 打包，产物仅存 Actions artifact
# 2. 发布 release：用该 release 的 tag 签出源码仓库打包，setup.exe 自动上传到该 release
#    （源码仓库需存在与 release 同名的 tag）
# 目标位数走矩阵：x64 / x86 双腿并行，各自解密对应 vis-env 归档并打出对应位数安装包。
# 本仓库是公开仓库，标准 runner 免费不限分钟数，不消耗私有仓库的 Actions 额度。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '源码分支 / tag / commit（llm-chat）'
        required: true
        default: 'main'
        type: string
  release:
    types: [published]

permissions:
  # write 用于 release 发布时上传附件；GITHUB_TOKEN 只对本仓库有效
  contents: write

env:
  SOURCE_REPO: kisaragychihaya/llm-chat

jobs:
  package:
    runs-on: windows-latest
    strategy:
      # 一条腿失败不拖垮另一条（x86 打包链路仍在验证期）
      fail-fast: false
      matrix:
        arch: [x64, x86]
    env:
      # release 事件用 release 的 tag 签出源码；手动触发用输入的 ref
      SOURCE_REF: ${{ github.event.release.tag_name || inputs.ref }}
      # 位数环境变量：vis-env 归档选择 + 目标架构（forge 裁剪、node.exe、npm 依赖位数对齐）
      VISENV_ARCH: ${{ matrix.arch }}
      TARGET_ARCH: ${{ matrix.arch == 'x86' && 'ia32' || 'x64' }}
      npm_config_arch: ${{ matrix.arch == 'x86' && 'ia32' || 'x64' }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # x86 腿：node-pty / ripgrep 上游无 ia32 预编译，从本仓库常驻 release native-ia32
      # 取预编译件放置（由 native-ia32 workflow 产出，见 .github/workflows/native-ia32.yml；
      # node-pty 加载序 build/Release → prebuilds/win32-ia32，ripgrep 运行期按 process.arch
      # 解析 @vscode/ripgrep-win32-ia32/bin/rg.exe）
      - name: Place ia32 native prebuilts (node-pty / ripgrep)
        if: matrix.arch == 'x86'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-ia32 --repo ${{ github.repository }} -D ia32-native --clobber
          $pty = "node_modules\node-pty\prebuilds\win32-ia32"
          New-Item -ItemType Directory -Force $pty | Out-Null
          Copy-Item ia32-native\pty.node, ia32-native\conpty.node, ia32-native\conpty_console_list.node, ia32-native\winpty-agent.exe, ia32-native\winpty.dll $pty
          $rg = "node_modules\@vscode\ripgrep-win32-ia32\bin"
          New-Item -ItemType Directory -Force $rg | Out-Null
          Copy-Item ia32-native\rg.exe $rg
          Get-ChildItem $pty, $rg -Recurse -File -Name

      # runtime/node.exe 未入库（gitignore），需现下载；不打这步产物里 midscene 不可用
      - name: Fetch midscene node runtime
        run: npm run fetch-node

      # 再签出本仓库（nsi 脚本 + 便携 NSIS 压缩包 + 加密 vis-env 归档）到 packaging/ 子目录
      - name: Checkout packaging scripts (this repo)
        uses: actions/checkout@v7
        with:
          path: packaging

      - name: Extract NSIS
        run: 7z x packaging\nsis-binary-7423-3.7z -onsis -y

      # 解析目标位数：electron 架构 token（x64/ia32）与 setup/artifact 命名后缀（空 / -x86）
      - name: Resolve target arch
        id: arch
        run: |
          if ($env:VISENV_ARCH -eq 'x86') {
            "electron=ia32" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "suffix=-x86" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($env:VISENV_ARCH -eq 'x64') {
            "electron=x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "suffix=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            throw "未知位数 VISENV_ARCH=$env:VISENV_ARCH（期望 x64 / x86）"
          }

      # 内置 vis-env：本仓库 vis-env-<arch>.7z（AES-256 + 头加密，顶层目录 vis-env/），
      # 密码存 secret VISENV_7Z_PASSWORD。按 VISENV_ARCH 选对应位数归档，解压到 runtime/
      # 即得 runtime/vis-env/，随源码仓库 extraResource 进最终安装包（替代旧 CI 现场构建）。
      # 解密后校验 python.exe 并打印 VERSION，缺失即失败
      - name: Extract bundled vis-env (encrypted archive, by VISENV_ARCH)
        env:
          VISENV_7Z_PASSWORD: ${{ secrets.VISENV_7Z_PASSWORD }}
        run: |
          if (-not $env:VISENV_7Z_PASSWORD) { throw "缺少 secret VISENV_7Z_PASSWORD，无法解密内置 vis-env 归档" }
          7z x "packaging\vis-env-$env:VISENV_ARCH.7z" -p"$env:VISENV_7Z_PASSWORD" -o"${{ github.workspace }}\runtime" -y
          if (-not (Test-Path "runtime\vis-env\python.exe")) { throw "解密后缺少 runtime\vis-env\python.exe，请检查 vis-env-$env:VISENV_ARCH.7z 归档与 VISENV_7Z_PASSWORD 密码" }
          Get-Content "runtime\vis-env\VERSION"

      - name: Package (electron-forge package)
        run: npm run package -- --arch=${{ steps.arch.outputs.electron }}

      # setup.exe 的版本号取自源码仓库 package.json 的 version 字段
      - name: Read version from source package.json
        id: ver
        run: |
          $v = (node -p "require('./package.json').version").Trim()
          # VIProductVersion 必须是 x.x.x.x 纯数字格式，取数字部分并补齐 4 段
          $m = [regex]::Match($v, '\d+(\.\d+){0,3}')
          $parts = [System.Collections.Generic.List[string]]($m.Value.Split('.'))
          while ($parts.Count -lt 4) { $parts.Add('0') }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version4=$($parts -join '.')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build setup.exe (NSIS)
        run: |
          $appDir = "${{ github.workspace }}\out\VIrobotics Harness-win32-${{ steps.arch.outputs.electron }}"
          if (-not (Test-Path $appDir)) { throw "electron-forge 产物目录不存在: $appDir" }
          & .\nsis\nsis-binary-7423-3\makensis.exe `
            "/DPRODUCT_VERSION=${{ steps.ver.outputs.version }}" `
            "/DPRODUCT_VERSION4=${{ steps.ver.outputs.version4 }}" `
            "/DAPP_SOURCE_DIR=$appDir" `
            "/DSETUP_OUT_DIR=${{ github.workspace }}" `
            "/DSETUP_NAME_SUFFIX=${{ steps.arch.outputs.suffix }}" `
            packaging\vih.nsi

      - uses: actions/upload-artifact@v7
        with:
          name: VIrobotics-Harness-Setup-v${{ steps.ver.outputs.version }}${{ steps.arch.outputs.suffix }}
          path: VIrobotics-Harness-Setup-v${{ steps.ver.outputs.version }}${{ steps.arch.outputs.suffix }}.exe
          if-no-files-found: error
          retention-days: 7

      # 仅在发布 release 时运行：把 setup.exe 挂到该 release 的附件里
      # 注意：工作区根目录签出的是源码仓库，gh 会优先用 git remote 判断目标仓库，
      # 所以必须用 --repo 显式指定本仓库
      - name: Upload setup.exe to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "VIrobotics-Harness-Setup-v${{ steps.ver.outputs.version }}${{ steps.arch.outputs.suffix }}.exe" `
            --clobber
