name: nightly-package

# 两种方式触发：
# 1. 手动触发：拉取私有仓库 kisaragychihaya/llm-chat 指定 ref 打包，产物仅存 Actions artifact
# 2. 发布 release：用该 release 的 tag 签出源码仓库打包，setup.exe 自动上传到该 release
#    （源码仓库需存在与 release 同名的 tag）
# 本仓库是公开仓库，标准 runner 免费不限分钟数，不消耗私有仓库的 Actions 额度。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '源码分支 / tag / commit（llm-chat）'
        required: true
        default: 'main'
        type: string
      visenv_whl_version:
        description: 'viscriptpy wheel 版本（如 2026.9.22；留空用脚本内 pin 的默认版本）'
        required: false
        default: ''
        type: string
  release:
    types: [published]

permissions:
  # write 用于 release 发布时上传附件；GITHUB_TOKEN 只对本仓库有效
  contents: write

env:
  SOURCE_REPO: kisaragychihaya/llm-chat

jobs:
  package:
    runs-on: windows-latest
    env:
      # release 事件用 release 的 tag 签出源码；手动触发用输入的 ref
      SOURCE_REF: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # runtime/node.exe 未入库（gitignore），需现下载；不打这步产物里 midscene 不可用
      - name: Fetch midscene node runtime
        run: npm run fetch-node

      # CI runner 无本机 vis-env：用 embeddable Python 3.12 现场构建 runtime/vis-env
      # （放开 ._pth + uv 装 pip + 商店 CDN 装 viscriptpy whl），产物即内置 Python 环境
      - name: Build bundled vis-env (embeddable Python + pip + base whl)
        env:
          # 留空时回退脚本内 pin 的默认版本；release 事件无 inputs，恒为空
          VISENV_WHL_VERSION: ${{ inputs.visenv_whl_version }}
        run: npm run fetch-visenv:ci

      - name: Package (electron-forge package)
        run: npm run package

      # 再签出本仓库（nsi 脚本 + 便携 NSIS 压缩包）到 packaging/ 子目录
      - name: Checkout packaging scripts (this repo)
        uses: actions/checkout@v7
        with:
          path: packaging

      - name: Extract NSIS
        run: 7z x packaging\nsis-binary-7423-3.7z -onsis -y

      # setup.exe 的版本号取自源码仓库 package.json 的 version 字段
      - name: Read version from source package.json
        id: ver
        run: |
          $v = (node -p "require('./package.json').version").Trim()
          # VIProductVersion 必须是 x.x.x.x 纯数字格式，取数字部分并补齐 4 段
          $m = [regex]::Match($v, '\d+(\.\d+){0,3}')
          $parts = [System.Collections.Generic.List[string]]($m.Value.Split('.'))
          while ($parts.Count -lt 4) { $parts.Add('0') }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version4=$($parts -join '.')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build setup.exe (NSIS)
        run: |
          $appDir = "${{ github.workspace }}\out\VIrobotics Harness-win32-x64"
          if (-not (Test-Path $appDir)) { throw "electron-forge 产物目录不存在: $appDir" }
          & .\nsis\nsis-binary-7423-3\makensis.exe `
            "/DPRODUCT_VERSION=${{ steps.ver.outputs.version }}" `
            "/DPRODUCT_VERSION4=${{ steps.ver.outputs.version4 }}" `
            "/DAPP_SOURCE_DIR=$appDir" `
            "/DSETUP_OUT_DIR=${{ github.workspace }}" `
            packaging\vih.nsi

      - uses: actions/upload-artifact@v7
        with:
          name: VIrobotics-Harness-Setup-v${{ steps.ver.outputs.version }}
          path: VIrobotics-Harness-Setup-v${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7

      # 仅在发布 release 时运行：把 setup.exe 挂到该 release 的附件里
      # 注意：工作区根目录签出的是源码仓库，gh 会优先用 git remote 判断目标仓库，
      # 所以必须用 --repo 显式指定本仓库
      - name: Upload setup.exe to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "VIrobotics-Harness-Setup-v${{ steps.ver.outputs.version }}.exe" `
            --clobber
